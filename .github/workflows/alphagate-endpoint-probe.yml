name: AlphaGate endpoint read-only validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/alphagate-endpoint-probe.yml'
      - 'alphagate-probe/**'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python alphagate-probe/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: alphagate-endpoint-probe
          path: out-alphagate-endpoints/
          retention-days: 1
          if-no-files-found: error
