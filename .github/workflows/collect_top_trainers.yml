name: pokemon-top-trainers
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OP.GG top trainers
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          for page in 1 2 3 4 5; do
            curl -L --compressed --retry 3 --connect-timeout 20 --max-time 120 \
              -A "$UA" -H 'Accept-Language: ja,en;q=0.8' \
              "https://op.gg/ja/pokemon-champions/top-trainers?page=${page}" \
              -o "out/page-${page}.html"
            test $(wc -c < "out/page-${page}.html") -gt 100000
          done
          date -u +%FT%TZ > out/fetched_at_utc.txt
          sha256sum out/*.html > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-top-trainers-pages
          path: out
          retention-days: 7
