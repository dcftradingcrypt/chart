name: MintGo and GUAP public snapshots
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'nft-site-snapshots/**'
      - '.github/workflows/mintgo-guap-snapshots.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture public sites
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          node nft-site-snapshots/collect.mjs
      - name: Build manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('out');root.mkdir(exist_ok=True)
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file(): rows.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'manifest.json').write_text(json.dumps({'files':rows},indent=2),encoding='utf-8')
          PY
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mintgo-guap-public-snapshots
          path: out/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
