name: RHC canonical data result publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-canonical-result-publisher.yml'
      - 'rhc-data-completion/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: rhc-canonical-result-publisher-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Locate latest canonical run for branch, wait, and download artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request, zipfile, io
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; branch=os.environ['HEAD_BRANCH']
          headers={'accept':'application/vnd.github+json','authorization':f'Bearer {token}','user-agent':'RHC-Result-Publisher/1.0','x-github-api-version':'2022-11-28'}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=90) as response:
                  return json.loads(response.read())
          run=None
          for _ in range(300):
              url=(f'https://api.github.com/repos/{repo}/actions/workflows/rhc-canonical-data-completion.yml/runs?'
                   f'event=pull_request&branch={urllib.parse.quote(branch)}&per_page=30')
              runs=get_json(url).get('workflow_runs',[])
              if runs:
                  run=sorted(runs,key=lambda value:value['id'],reverse=True)[0]
                  print({'run_id':run['id'],'status':run['status'],'conclusion':run.get('conclusion'),'head_sha':run.get('head_sha')},flush=True)
                  if run['status']=='completed': break
              time.sleep(30)
          if not run or run.get('status')!='completed':
              raise SystemExit('canonical run did not complete')
          artifacts=get_json(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100').get('artifacts',[])
          required={'rhc-global-seadrop','rhc-global-seaport'} | {f'rhc-canonical-wallet-{i}' for i in range(16)}
          pathlib.Path('downloaded').mkdir(exist_ok=True)
          for artifact in artifacts:
              if artifact['name'] not in required: continue
              req=urllib.request.Request(artifact['archive_download_url'],headers=headers)
              with urllib.request.urlopen(req,timeout=300) as response: payload=response.read()
              dest=pathlib.Path('downloaded')/artifact['name']; dest.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive: archive.extractall(dest)
          pathlib.Path('out-consolidated').mkdir(exist_ok=True)
          (pathlib.Path('out-consolidated')/'SOURCE_RUN.json').write_text(json.dumps({
              'canonical_run_id':run['id'],
              'canonical_run_head_sha':run.get('head_sha'),
              'canonical_run_conclusion':run.get('conclusion'),
              'artifact_names':sorted(a['name'] for a in artifacts),
              'required_artifacts':sorted(required),
              'missing_required_artifacts':sorted(required-{a['name'] for a in artifacts}),
              'publisher_run_id':int(os.environ.get('GITHUB_RUN_ID','0')),
          },indent=2,sort_keys=True))
          PY
      - name: Consolidate
        if: always()
        run: python rhc-data-completion/consolidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-canonical-data-consolidated
          path: out-consolidated/
          retention-days: 10
          if-no-files-found: error
          compression-level: 9
      - name: Publish machine-readable result pointer on temporary branch
        if: always()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p .results
          cp out-consolidated/DATA_COMPLETENESS.json .results/rhc-canonical-data-completeness.json || true
          cp out-consolidated/SOURCE_RUN.json .results/rhc-canonical-source-run.json || true
          cp out-consolidated/REMEDIATION_QUEUE.csv .results/rhc-canonical-remediation-queue.csv || true
          python - <<'PY'
          import json, os, pathlib
          path=pathlib.Path('.results/rhc-canonical-publisher.json')
          path.write_text(json.dumps({
              'publisher_run_id':int(os.environ['GITHUB_RUN_ID']),
              'publisher_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'head_sha':os.environ['GITHUB_SHA'],
          },indent=2,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .results/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: publish canonical data collection result [skip ci]'
          git push origin "HEAD:${HEAD_BRANCH}"
