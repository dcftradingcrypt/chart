name: Monitor complete RHC NFT data collection

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-data-collection-monitor.yml'
      - 'data-collection-monitor/TRIGGER_20260829.txt'

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: rhc-data-collection-monitor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      MONITOR_BRANCH: chatgpt/rhc-data-collection-monitor-20260829
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rhc-data-collection-monitor-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Poll immutable evidence gates on every collection branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data-collection-monitor/runtime
          cat > data-collection-monitor/runtime/monitor.py <<'PY'
          from __future__ import annotations
          import json, os, pathlib, subprocess, time, datetime

          REPO = os.environ['GITHUB_REPOSITORY']
          SPECS = [
              {
                  'id': 'p1c_wallets',
                  'branch': 'chatgpt/rhc-wallet-verification-p1c-20260829',
                  'validation_glob': 'wallet-verification-p1c/evidence-run-*/AGGREGATE_VALIDATION.json',
                  'required_status': 'PASS',
                  'expected': {'artifact_count': 5, 'unique_target_wallets': 5},
              },
              {
                  'id': 'p2_wallets',
                  'branch': 'chatgpt/rhc-wallet-verification-p2-20260829',
                  'validation_glob': 'wallet-verification-p2/evidence-run-*/AGGREGATE_VALIDATION.json',
                  'required_status': 'PASS',
                  'expected': {'artifact_count': 16, 'p2_wallet_count_sum': 212},
              },
              {
                  'id': 'nft_contract_universe',
                  'branch': 'chatgpt/rhc-nft-contract-universe-20260829',
                  'validation_glob': 'nft-universe/evidence-run-*/VALIDATION.json',
                  'required_status': 'PASS',
                  'expected_positive': ['unique_nft_contracts'],
              },
              {
                  'id': 'nft_contract_details',
                  'branch': 'chatgpt/rhc-nft-contract-universe-20260829',
                  'validation_glob': 'nft-universe/contract-details-run-*/AGGREGATE_VALIDATION.json',
                  'required_status': 'PASS',
                  'expected': {'artifact_count': 32},
                  'equality': [('covered_contracts', 'universe_contracts')],
              },
              {
                  'id': 'canonical_event_history',
                  'branch': 'chatgpt/rhc-canonical-event-history-20260829',
                  'validation_glob': 'canonical-history/evidence-run-*/AGGREGATE_VALIDATION.json',
                  'required_status': 'PASS',
                  'expected_len': {'targets': 2},
              },
              {
                  'id': 'mint_transaction_enrichment',
                  'branch': 'chatgpt/rhc-mint-tx-enrichment-20260829',
                  'validation_glob': 'mint-enrichment/evidence-run-*/AGGREGATE_VALIDATION.json',
                  'required_status': 'PASS',
                  'equality': [('enriched_transactions', 'source_unique_mint_transactions')],
              },
              {
                  'id': 'seaport_transaction_enrichment',
                  'branch': 'chatgpt/rhc-seaport-tx-enrichment-20260829',
                  'validation_glob': 'sale-enrichment/evidence-run-*/AGGREGATE_VALIDATION.json',
                  'required_status': 'PASS',
                  'equality': [('enriched_transactions', 'source_unique_transactions')],
              },
          ]

          def run(*args: str, check: bool = True) -> str:
              cp = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and cp.returncode:
                  raise RuntimeError(f"command failed {args}: {cp.stderr[-2000:]}")
              return cp.stdout

          def alias(branch: str) -> str:
              return branch.replace('/', '__')

          def fetch_branch(branch: str) -> tuple[bool, str | None]:
              ref = f"refs/remotes/collector/{alias(branch)}"
              cp = subprocess.run(
                  ['git', 'fetch', '--force', '--depth=1', 'origin', f'{branch}:{ref}'],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )
              return cp.returncode == 0, ref if cp.returncode == 0 else cp.stderr[-2000:]

          def latest_path(ref: str, glob_pattern: str) -> str | None:
              names = run('git', 'ls-tree', '-r', '--name-only', ref).splitlines()
              import fnmatch
              matches = sorted((name for name in names if fnmatch.fnmatch(name, glob_pattern)))
              return matches[-1] if matches else None

          def workflow_snapshot(branch: str) -> list[dict]:
              try:
                  raw = run('gh', 'api', '--paginate', f'/repos/{REPO}/actions/runs?branch={branch}&event=pull_request&per_page=100')
                  data = json.loads(raw)
                  rows = data.get('workflow_runs', [])
                  rows.sort(key=lambda row: row.get('created_at', ''), reverse=True)
                  compact = []
                  seen = set()
                  for row in rows:
                      name = row.get('name')
                      if name in seen:
                          continue
                      seen.add(name)
                      compact.append({
                          'id': row.get('id'),
                          'name': name,
                          'status': row.get('status'),
                          'conclusion': row.get('conclusion'),
                          'head_sha': row.get('head_sha'),
                          'created_at': row.get('created_at'),
                          'updated_at': row.get('updated_at'),
                      })
                  return compact[:20]
              except Exception as exc:
                  return [{'error': repr(exc)}]

          def inspect(spec: dict) -> dict:
              ok, ref_or_error = fetch_branch(spec['branch'])
              result = {
                  'id': spec['id'],
                  'branch': spec['branch'],
                  'branch_fetch_ok': ok,
                  'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'workflow_runs': workflow_snapshot(spec['branch']),
                  'gate_status': 'MISSING',
                  'validation_path': None,
                  'validation': None,
                  'gate_failures': [],
              }
              if not ok:
                  result['branch_error'] = ref_or_error
                  return result
              ref = ref_or_error
              path = latest_path(ref, spec['validation_glob'])
              result['validation_path'] = path
              if not path:
                  return result
              try:
                  data = json.loads(run('git', 'show', f'{ref}:{path}'))
                  result['validation'] = data
              except Exception as exc:
                  result['gate_status'] = 'INVALID_JSON'
                  result['gate_failures'].append({'code': 'VALIDATION_UNREADABLE', 'error': repr(exc)})
                  return result
              failures = []
              if data.get('status') != spec.get('required_status', 'PASS'):
                  failures.append({'code': 'STATUS_NOT_PASS', 'actual': data.get('status')})
              for key, expected in spec.get('expected', {}).items():
                  if int(data.get(key, -1)) != int(expected):
                      failures.append({'code': 'EXPECTED_VALUE_MISMATCH', 'key': key, 'expected': expected, 'actual': data.get(key)})
              for key in spec.get('expected_positive', []):
                  try:
                      value = int(data.get(key, 0))
                  except Exception:
                      value = 0
                  if value <= 0:
                      failures.append({'code': 'EXPECTED_POSITIVE_VALUE_MISSING', 'key': key, 'actual': data.get(key)})
              for key, expected_len in spec.get('expected_len', {}).items():
                  value = data.get(key)
                  if not isinstance(value, list) or len(value) != expected_len:
                      failures.append({'code': 'EXPECTED_LIST_LENGTH_MISMATCH', 'key': key, 'expected': expected_len, 'actual': len(value) if isinstance(value, list) else None})
              for left, right in spec.get('equality', []):
                  if data.get(left) != data.get(right):
                      failures.append({'code': 'EQUALITY_GATE_FAILED', 'left': left, 'left_value': data.get(left), 'right': right, 'right_value': data.get(right)})
              result['gate_failures'] = failures
              result['gate_status'] = 'PASS' if not failures else 'FAIL'
              return result

          root = pathlib.Path('data-collection-monitor/runtime')
          final = None
          for attempt in range(1, 181):
              checks = [inspect(spec) for spec in SPECS]
              complete = all(row['gate_status'] == 'PASS' for row in checks)
              report = {
                  'status': 'PASS' if complete else 'IN_PROGRESS',
                  'attempt': attempt,
                  'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'required_gate_count': len(SPECS),
                  'passed_gate_count': sum(row['gate_status'] == 'PASS' for row in checks),
                  'checks': checks,
                  'deepseek_handoff_allowed': False,
                  'production_approved_wallets': 0,
                  'decision_use': 'DATA_COLLECTION_MONITOR_ONLY',
              }
              (root / 'LATEST_STATUS.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
              print(json.dumps({
                  'attempt': attempt,
                  'passed': report['passed_gate_count'],
                  'required': report['required_gate_count'],
                  'states': {row['id']: row['gate_status'] for row in checks},
              }, sort_keys=True), flush=True)
              final = report
              if complete:
                  break
              time.sleep(110)
          assert final is not None
          final['status'] = 'PASS' if all(row['gate_status'] == 'PASS' for row in final['checks']) else 'TIMEOUT_INCOMPLETE'
          final['deepseek_handoff_allowed'] = False
          (root / 'FINAL_STATUS.json').write_text(json.dumps(final, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python data-collection-monitor/runtime/monitor.py
      - name: Commit evidence-gate monitor report to monitor branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dest="data-collection-monitor/reports/${timestamp}"
          mkdir -p "$dest"
          cp data-collection-monitor/runtime/LATEST_STATUS.json "$dest/" 2>/dev/null || true
          cp data-collection-monitor/runtime/FINAL_STATUS.json "$dest/" 2>/dev/null || true
          git config user.name 'rhc-data-monitor'
          git config user.email 'actions@users.noreply.github.com'
          git add "$dest"
          if git diff --cached --quiet; then
            echo 'no report generated'
            exit 1
          fi
          git commit -m "data: persist RHC collection monitor ${timestamp}"
          for attempt in $(seq 1 10); do
            git fetch origin "$MONITOR_BRANCH"
            git rebase "origin/$MONITOR_BRANCH"
            if git push origin "HEAD:$MONITOR_BRANCH"; then
              break
            fi
            [[ "$attempt" == 10 ]] && exit 1
            sleep $((attempt * 3))
          done
      - name: Fail closed until every evidence gate is PASS
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data-collection-monitor/runtime/FINAL_STATUS.json'))
          assert d['status']=='PASS',d
          assert d['passed_gate_count']==d['required_gate_count'],d
          assert d['deepseek_handoff_allowed'] is False,d
          PY
