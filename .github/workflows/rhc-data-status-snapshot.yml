name: Snapshot RHC data collection status

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-data-status-snapshot.yml'
      - 'data-collection-monitor/TRIGGER_STATUS_SNAPSHOT.txt'

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      MONITOR_BRANCH: chatgpt/rhc-data-collection-monitor-20260829
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rhc-data-collection-monitor-20260829
          fetch-depth: 0
      - name: Capture current branch, workflow, and evidence state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data-collection-monitor/snapshots
          python - <<'PY'
          import datetime, json, os, pathlib, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          specs=[
            ('p1c','chatgpt/rhc-wallet-verification-p1c-20260829','wallet-verification-p1c/evidence-run-*/AGGREGATE_VALIDATION.json'),
            ('p2','chatgpt/rhc-wallet-verification-p2-20260829','wallet-verification-p2/evidence-run-*/AGGREGATE_VALIDATION.json'),
            ('universe','chatgpt/rhc-nft-contract-universe-20260829','nft-universe/evidence-run-*/VALIDATION.json'),
            ('details','chatgpt/rhc-nft-contract-universe-20260829','nft-universe/contract-details-run-*/AGGREGATE_VALIDATION.json'),
            ('canonical','chatgpt/rhc-canonical-event-history-20260829','canonical-history/evidence-run-*/AGGREGATE_VALIDATION.json'),
            ('mint','chatgpt/rhc-mint-tx-enrichment-20260829','mint-enrichment/evidence-run-*/AGGREGATE_VALIDATION.json'),
            ('sale','chatgpt/rhc-seaport-tx-enrichment-20260829','sale-enrichment/evidence-run-*/AGGREGATE_VALIDATION.json'),
          ]
          def cp(*args):
            return subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          rows=[]
          for ident,branch,pattern in specs:
            alias=branch.replace('/','__')
            ref=f'refs/remotes/status/{alias}'
            fetch=cp('git','fetch','--force','--depth=1','origin',f'{branch}:{ref}')
            row={'id':ident,'branch':branch,'branch_fetch_ok':fetch.returncode==0,'branch_error':fetch.stderr[-1000:] if fetch.returncode else None,'workflow_runs':[],'validation_path':None,'validation':None}
            runs=cp('gh','api','--paginate',f'/repos/{repo}/actions/runs?branch={branch}&event=pull_request&per_page=100')
            if runs.returncode==0:
              try:
                data=json.loads(runs.stdout); seen=set()
                for r in sorted(data.get('workflow_runs',[]),key=lambda x:x.get('created_at',''),reverse=True):
                  if r.get('name') in seen: continue
                  seen.add(r.get('name'))
                  row['workflow_runs'].append({k:r.get(k) for k in ('id','name','status','conclusion','head_sha','created_at','updated_at')})
              except Exception as e: row['workflow_parse_error']=repr(e)
            else: row['workflow_error']=runs.stderr[-1000:]
            if fetch.returncode==0:
              names=cp('git','ls-tree','-r','--name-only',ref)
              if names.returncode==0:
                import fnmatch
                matches=sorted(n for n in names.stdout.splitlines() if fnmatch.fnmatch(n,pattern))
                if matches:
                  path=matches[-1]; row['validation_path']=path
                  value=cp('git','show',f'{ref}:{path}')
                  if value.returncode==0:
                    try: row['validation']=json.loads(value.stdout)
                    except Exception as e: row['validation_error']=repr(e)
            rows.append(row)
          report={'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'rows':rows,'deepseek_handoff_allowed':False,'production_approved_wallets':0}
          out=pathlib.Path('data-collection-monitor/snapshots/LATEST_STATUS.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'rows':[{'id':r['id'],'latest':r['workflow_runs'][0] if r['workflow_runs'] else None,'gate':(r['validation'] or {}).get('status'),'path':r['validation_path']} for r in rows]},sort_keys=True))
          PY
      - name: Commit status snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rhc-data-monitor'
          git config user.email 'actions@users.noreply.github.com'
          git add data-collection-monitor/snapshots/LATEST_STATUS.json
          git commit -m 'data: update RHC collection status snapshot'
          for attempt in $(seq 1 10); do
            git fetch origin "$MONITOR_BRANCH"
            git rebase "origin/$MONITOR_BRANCH"
            if git push origin "HEAD:$MONITOR_BRANCH"; then break; fi
            [[ "$attempt" == 10 ]] && exit 1
            sleep $((attempt*3))
          done
