name: RHC canonical NFT data v2 execution and copy research

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-data-v2-advanced.yml'
      - 'rhc-data-v2/derive_execution.py'
      - 'rhc-data-v2/derive_copy_proxy.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: rhc-data-v2-advanced-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for core package and matching collection artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,json,os,pathlib,time,urllib.parse,urllib.request,zipfile
          repo=os.environ['REPO']; branch=os.environ['HEAD_BRANCH']; sha=os.environ['HEAD_SHA']; token=os.environ['GH_TOKEN']
          headers={'accept':'application/vnd.github+json','authorization':f'Bearer {token}','user-agent':'RHC-V2-Advanced/1.0','x-github-api-version':'2022-11-28'}
          raw_base=f'https://raw.githubusercontent.com/{repo}/{urllib.parse.quote(branch,safe="")}/.results'
          core_index=None; core_payload=None
          for attempt in range(600):
              try:
                  with urllib.request.urlopen(raw_base+'/rhc-v2-core-index.json',timeout=60) as response: core_index=json.loads(response.read())
                  with urllib.request.urlopen(raw_base+'/rhc-v2-core-datasets.zip',timeout=300) as response: core_payload=response.read()
                  if hashlib.sha256(core_payload).hexdigest()==core_index.get('sha256'): break
              except Exception as exc:
                  if attempt%10==0: print({'waiting_core':attempt,'error':repr(exc)},flush=True)
              time.sleep(30)
          if not core_index or not core_payload: raise SystemExit('core package unavailable')
          pathlib.Path('input-core').mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(core_payload)) as archive: archive.extractall('input-core')

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=120) as response: return json.loads(response.read())
          run=None
          for attempt in range(600):
              url=(f'https://api.github.com/repos/{repo}/actions/workflows/rhc-data-completion-v2.yml/runs?event=pull_request&branch={urllib.parse.quote(branch)}&per_page=40')
              matches=[value for value in get(url).get('workflow_runs',[]) if value.get('head_sha')==sha]
              if matches:
                  run=sorted(matches,key=lambda value:value['id'],reverse=True)[0]
                  if run['status']=='completed': break
              time.sleep(30)
          if not run or run.get('status')!='completed': raise SystemExit('matching collection run unavailable')
          artifacts=get(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100').get('artifacts',[])
          required={f'rhc-v2-enrich-{i}' for i in range(32)}
          missing=sorted(required-{value['name'] for value in artifacts})
          if missing: raise SystemExit(json.dumps({'code':'MISSING_ENRICH_ARTIFACTS','missing':missing}))
          pathlib.Path('input-raw').mkdir(exist_ok=True)
          for artifact in artifacts:
              if artifact['name'] not in required: continue
              req=urllib.request.Request(artifact['archive_download_url'],headers=headers)
              with urllib.request.urlopen(req,timeout=600) as response: payload=response.read()
              destination=pathlib.Path('input-raw')/artifact['name']; destination.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive: archive.extractall(destination)
          pathlib.Path('source.json').write_text(json.dumps({'collection_run_id':run['id'],'head_sha':sha,'core_index':core_index},indent=2,sort_keys=True))
          PY
      - name: Derive token-level Execution Alpha research data
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=rhc-data-v2 python rhc-data-v2/derive_execution.py --core input-core --raw input-raw --out out-execution
      - name: Derive copy-entry and market-exit proxies
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=rhc-data-v2 python rhc-data-v2/derive_copy_proxy.py --core input-core --out out-copy
      - name: Package and publish advanced research datasets
        if: always()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p out-advanced/execution out-advanced/copy .results
          cp -a out-execution/. out-advanced/execution/ 2>/dev/null || true
          cp -a out-copy/. out-advanced/copy/ 2>/dev/null || true
          cp source.json out-advanced/ 2>/dev/null || true
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          source=pathlib.Path('out-advanced'); archive=pathlib.Path('.results/rhc-v2-advanced-datasets.zip')
          if archive.exists(): archive.unlink()
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as output:
              for path in sorted(source.rglob('*')):
                  if path.is_file(): output.write(path,path.relative_to(source.parent))
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          index={'package':archive.name,'bytes':archive.stat().st_size,'sha256':digest,'publisher_run_id':int(os.environ['GITHUB_RUN_ID']),'files':[str(path.relative_to(source)) for path in sorted(source.rglob('*')) if path.is_file()]}
          pathlib.Path('.results/rhc-v2-advanced-index.json').write_text(json.dumps(index,indent=2,sort_keys=True))
          pathlib.Path('.results/rhc-v2-advanced-datasets.zip.sha256').write_text(digest+'  '+archive.name+'\n')
          if archive.stat().st_size>90_000_000: raise SystemExit('advanced package exceeds GitHub file limit')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: publish RHC execution and copy research data [skip ci]'
          git push origin "HEAD:${HEAD_BRANCH}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-v2-advanced-datasets
          path: out-advanced/
          retention-days: 14
          if-no-files-found: error
          compression-level: 9
