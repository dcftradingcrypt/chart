name: RHC finality probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-finality-probe.yml'
      - 'rhc-finality/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python rhc-finality/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-finality-probe
          path: out-finality/
          retention-days: 2
          if-no-files-found: error
          compression-level: 9
