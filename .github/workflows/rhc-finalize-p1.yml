name: Finalize RHC P1 verification checkpoint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-finalize-p1.yml'
      - 'recovered-p1-partial-checkpoint/RECOVERY_REPORT.json'

permissions:
  actions: read
  contents: write

concurrency:
  group: rhc-finalize-p1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW_NAME: 'Re-run only missing RHC P1 shards'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Determine whether finalization is ready
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path('recovered-p1-partial-checkpoint/RECOVERY_REPORT.json')
          if not p.exists():
              print('ready=false')
              print('has_missing=false')
              print('missing_json=[]')
          else:
              d=json.loads(p.read_text())
              missing=[k for k,v in d.get('shards',{}).items() if v.get('status')!='RECOVERED_NONEMPTY']
              print('ready=true')
              print('has_missing='+('true' if missing else 'false'))
              print('missing_json='+json.dumps(missing,separators=(',',':')))
          PY
      - name: Stop cleanly until recovery report exists
        if: steps.plan.outputs.ready != 'true'
        run: echo 'Recovery report is not present yet; no data collection or re-run was started.'
      - name: Reconstruct recovered partial package
        if: steps.plan.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat recovered-p1-partial-checkpoint/rhc-p1-partial-recovered.tar.gz.part-* > rhc-p1-partial-recovered.tar.gz
          expected=$(awk '{print $1}' recovered-p1-partial-checkpoint/SHA256SUMS.txt)
          actual=$(sha256sum rhc-p1-partial-recovered.tar.gz | awk '{print $1}')
          test "$expected" = "$actual"
          rm -rf final-p1-work
          mkdir final-p1-work
          tar -xzf rhc-p1-partial-recovered.tar.gz -C final-p1-work
      - name: Wait for and download targeted missing-shard artifacts
        if: steps.plan.outputs.ready == 'true' && steps.plan.outputs.has_missing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ github.event.pull_request.head.ref }}'
          run_id=''
          for i in $(seq 1 180); do
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&per_page=100" --jq ".workflow_runs | map(select(.name == env.TARGET_WORKFLOW_NAME)) | sort_by(.id) | last | .id // empty")
            if [ -n "$run_id" ]; then
              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')
              echo "targeted run ${run_id}: ${status} ${conclusion}"
              if [ "$status" = completed ]; then
                test "$conclusion" = success
                break
              fi
            fi
            sleep 15
          done
          test -n "$run_id"
          mkdir -p final-p1-work/targeted-reruns
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -D final-p1-work/targeted-reruns
          echo "$run_id" > final-p1-work/TARGETED_RERUN_ID.txt
      - name: Build final four-shard evidence checkpoint
        if: steps.plan.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv,json,hashlib,shutil
          root=Path('final-p1-work')
          candidates=[p for p in root.rglob('*') if p.is_file()]
          report={'status':'PASS','shards':{}}
          for shard in ('p1a','p1b','p1c','p1d'):
              paths=[p for p in candidates if shard in str(p).lower()]
              counts={};substantive=0
              for p in paths:
                  if p.suffix.lower()=='.csv':
                      try:
                          with p.open(newline='',encoding='utf-8-sig') as f:n=sum(1 for _ in csv.DictReader(f))
                          counts[str(p)]=n
                          if n>0 and any(k in p.name.lower() for k in ('transaction','transfer','receipt','event','evidence','summary','wallet')):substantive+=n
                      except Exception as exc:counts[str(p)]={'error':repr(exc)}
                  elif p.suffix.lower()=='.json':
                      try:
                          obj=json.loads(p.read_text(encoding='utf-8-sig'));counts[str(p)]={'json_type':type(obj).__name__}
                      except Exception as exc:counts[str(p)]={'error':repr(exc)}
              status='PASS_NONEMPTY' if paths and substantive>0 else 'FAIL_EMPTY_OR_MISSING'
              if status!='PASS_NONEMPTY':report['status']='FAIL'
              report['shards'][shard]={'status':status,'file_count':len(paths),'substantive_rows':substantive,'row_counts':counts}
          report['production_approved_wallets']=0
          report['decision_use']='RESEARCH_EVIDENCE_ONLY_NOT_STRONG_WALLET_APPROVAL'
          Path('final-p1-work/P1_FINAL_VALIDATION.json').write_text(json.dumps(report,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(report,indent=2,sort_keys=True))
          if report['status']!='PASS':raise SystemExit(1)
          # immutable manifest over final work before packaging
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():rows.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('final-p1-work/MANIFEST.json').write_text(json.dumps(rows,indent=2,sort_keys=True),encoding='utf-8')
          PY
          tar -czf rhc-p1-final.tar.gz final-p1-work
          rm -rf recovered-p1-final-checkpoint
          mkdir recovered-p1-final-checkpoint
          split -b 40m -d -a 3 rhc-p1-final.tar.gz recovered-p1-final-checkpoint/rhc-p1-final.tar.gz.part-
          sha256sum rhc-p1-final.tar.gz > recovered-p1-final-checkpoint/SHA256SUMS.txt
          cp final-p1-work/P1_FINAL_VALIDATION.json final-p1-work/MANIFEST.json recovered-p1-final-checkpoint/
      - name: Commit final P1 checkpoint to temporary branch
        if: steps.plan.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered-p1-final-checkpoint
          if git diff --cached --quiet; then
            echo 'No final P1 checkpoint changes.'
          else
            git commit -m 'chore: finalize complete P1 verification checkpoint'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
