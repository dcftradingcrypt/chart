name: RHC P1 exact verification publish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-p1-exact-publish.yml'
      - 'wallet-verification-exact/**'
      - 'wallet-verification-exact/TRIGGER_PUBLISH.txt'

permissions:
  contents: write

concurrency:
  group: rhc-p1-exact-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize fixed source queue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/dcftradingcrypt/chart/chatgpt/rhc-wallet-verification-p0p1-20260828/wallet-verification/wallets.json.gz.b64' \
            -o runtime/wallets.json.gz.b64
          base64 -d runtime/wallets.json.gz.b64 | gzip -d > runtime/wallets.json
      - name: Run fail-closed exact verifier
        id: verify
        shell: bash
        run: |
          set +e
          rm -rf out-p1-exact
          python wallet-verification-exact/verify_p1_exact.py \
            --wallets runtime/wallets.json \
            --out out-p1-exact
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit immutable research result to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research-results/rhc-p1-exact
          mkdir -p research-results/rhc-p1-exact
          cp -R out-p1-exact/. research-results/rhc-p1-exact/
          cp runtime/wallets.json research-results/rhc-p1-exact/input_wallets.json
          printf '%s\n' '${{ steps.verify.outputs.exit_code }}' > research-results/rhc-p1-exact/verifier_exit_code.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-results/rhc-p1-exact
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'data: publish P1 exact wallet verification evidence'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Enforce verifier result after preserving evidence
        shell: bash
        run: |
          test '${{ steps.verify.outputs.exit_code }}' = '0'
