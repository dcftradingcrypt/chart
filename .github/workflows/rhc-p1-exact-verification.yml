name: RHC P1 exact evidence verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-p1-exact-verification.yml'
      - 'p1-exact/**'

permissions:
  contents: read

concurrency:
  group: rhc-p1-exact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        shard: [p1a, p1b, p1c, p1d]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize exact collector and shard input
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p runtime
          cat p1-exact/chunks/collector.part00 p1-exact/chunks/collector.part01 p1-exact/chunks/collector.part02 | base64 -d | gzip -d > runtime/collector.py
          cat p1-exact/chunks/wallets.part00 p1-exact/chunks/wallets.part01 | base64 -d | gzip -d > runtime/wallets-all.json
          echo '6c3be0d2336f3fe6b5ce4a67cf313c43dbaa5ef108ddb0083d620d940480f5d7  runtime/collector.py' | sha256sum -c -
          echo 'a79cfa03297aaad2f475bd2de26d91407bc127e53e81e5d45e21a83425d56e40  runtime/wallets-all.json' | sha256sum -c -
          python -m py_compile runtime/collector.py
          python - <<'PY'
          import json, os
          rows=json.load(open('runtime/wallets-all.json'))
          assert len(rows)==19
          start,end={'p1a':(0,5),'p1b':(5,10),'p1c':(10,15),'p1d':(15,19)}[os.environ['SHARD']]
          selected=rows[start:end]
          json.dump(selected,open('runtime/wallets.json','w'),indent=2)
          print({'shard':os.environ['SHARD'],'wallets':len(selected),'mints':sum(len(x.get('known_mints') or []) for x in selected),'sale_tokens':sum(len(x.get('known_sales') or []) for x in selected)})
          PY
      - name: Verify exact canonical evidence
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: python runtime/collector.py --input runtime/wallets.json --out "out-${SHARD}"
      - name: Preserve inputs and collector
        if: always()
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "out-${SHARD}/runtime"
          cp runtime/collector.py runtime/wallets-all.json "out-${SHARD}/runtime/" 2>/dev/null || true
          cp runtime/wallets.json "out-${SHARD}/runtime/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-p1-exact-${{ matrix.shard }}
          path: out-${{ matrix.shard }}/
          retention-days: 3
          if-no-files-found: error
          compression-level: 9
