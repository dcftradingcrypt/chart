name: RHC P2 artifact recovery inventory

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-p2-artifact-recovery.yml'
      - 'p2-recovery/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: rhc-p2-artifact-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory and recover all non-expired P2 artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python p2-recovery/recover_v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-p2-artifact-recovery
          path: out-p2-recovery/
          retention-days: 3
          if-no-files-found: error
          compression-level: 9
