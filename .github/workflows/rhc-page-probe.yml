name: RHC log page parameter probe
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-page-probe.yml'
      - 'rhc-direct-probe/page_probe.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python rhc-direct-probe/page_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-page-probe
          path: out-pages/
          retention-days: 1
          if-no-files-found: error
