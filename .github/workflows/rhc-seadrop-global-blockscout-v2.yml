name: Robinhood Chain global SeaDrop history via Blockscout v2
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'rhc-seadrop-population/collect_global_blockscout_v2.py'
      - '.github/workflows/rhc-seadrop-global-blockscout-v2.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect all canonical SeaDropMint events with rate limiting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-global-blockscout-v2
          OUT=out-global-blockscout-v2 python rhc-seadrop-population/collect_global_blockscout_v2.py 2>&1 | tee out-global-blockscout-v2/collector.log
      - name: Build manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('out-global-blockscout-v2');root.mkdir(exist_ok=True);rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():rows.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'manifest.json').write_text(json.dumps({'files':rows},indent=2),encoding='utf-8')
          PY
      - name: Upload global history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhc-seadrop-global-blockscout-v2
          path: out-global-blockscout-v2/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
