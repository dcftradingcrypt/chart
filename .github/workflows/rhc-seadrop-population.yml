name: Robinhood Chain canonical SeaDrop population

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'rhc-seadrop-population/**'
      - '.github/workflows/rhc-seadrop-population.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan canonical SeaDropMint events
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          OUT=out python rhc-seadrop-population/collect.py 2>&1 | tee out/collector.log
      - name: Build manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('out'); root.mkdir(exist_ok=True)
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file(): rows.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'manifest.json').write_text(json.dumps({'files':rows},indent=2),encoding='utf-8')
          PY
      - name: Upload population dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhc-seadrop-population
          path: out/
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
