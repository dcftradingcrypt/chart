name: RHC aggregate all secondary NFT transaction evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-secondary-enrichment-aggregate.yml'
      - 'rhc-secondary-enrichment-aggregate/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: rhc-secondary-enrichment-aggregate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for all secondary enrichment shards and merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python rhc-secondary-enrichment-aggregate/aggregate.py
      - name: Upload complete secondary transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhc-secondary-enrichment-aggregate
          path: rhc-secondary-enrichment-aggregate-output/
          retention-days: 10
          if-no-files-found: error
          compression-level: 9
      - name: Commit immutable source run and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rhc-secondary-enrichment-aggregate-stage/
          if git diff --cached --quiet; then
            echo 'No secondary aggregate status changes.'
          else
            git commit -m 'data: record secondary enrichment aggregate status [skip ci]'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
