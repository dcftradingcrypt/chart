name: RHC selection-alpha canonical histories

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-selection-alpha-history.yml'
      - 'rhc-selection-alpha/**'

permissions:
  contents: read

concurrency:
  group: rhc-selection-alpha-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  history:
    strategy:
      fail-fast: false
      matrix:
        target: [seadrop, seaport]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch complete canonical event history
        run: >-
          python rhc-selection-alpha/fetch_full_logs.py
          --target '${{ matrix.target }}'
          --out 'out-${{ matrix.target }}'
          --workers 8
          --initial-parts 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-selection-alpha-${{ matrix.target }}
          path: out-${{ matrix.target }}/
          retention-days: 2
          if-no-files-found: error
          compression-level: 9
