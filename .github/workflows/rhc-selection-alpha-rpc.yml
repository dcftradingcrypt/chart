name: RHC selection-alpha multi-RPC histories

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-selection-alpha-rpc.yml'
      - 'rhc-selection-alpha/fetch_rpc_logs.py'

permissions:
  contents: read

jobs:
  history:
    strategy:
      fail-fast: false
      matrix:
        target: [seadrop, seaport]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch complete multi-RPC event history
        run: >-
          python rhc-selection-alpha/fetch_rpc_logs.py
          --target '${{ matrix.target }}'
          --out 'out-${{ matrix.target }}'
          --workers 6
          --initial-window 1000000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-selection-alpha-rpc-${{ matrix.target }}
          path: out-${{ matrix.target }}/
          retention-days: 2
          if-no-files-found: error
          compression-level: 9
