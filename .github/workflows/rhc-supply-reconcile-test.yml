name: RHC supply reconciliation test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-supply-reconcile-test.yml'
      - 'rhc-supply-reconcile/**'

permissions:
  contents: read

concurrency:
  group: rhc-supply-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile standard mint supply, burns, and SeaDrop quantities
        run: python rhc-supply-reconcile/reconcile.py --contracts rhc-supply-reconcile/contracts.csv --out out-supply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-supply-reconciliation-test
          path: out-supply/
          retention-days: 2
          if-no-files-found: error
          compression-level: 9
