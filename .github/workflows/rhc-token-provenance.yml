name: RHC strict sold-token provenance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-token-provenance.yml'
      - 'token-provenance/**'

permissions:
  contents: read

concurrency:
  group: rhc-token-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect every ERC-721 Transfer event for strict paid-public contracts with proven Seaport sales
        run: |
          python token-provenance/collect_token_transfers.py \
            --contracts token-provenance/strict_sale_contracts.csv \
            --end-block 46840468 \
            --workers 4 \
            --out out-token-provenance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-token-provenance
          path: out-token-provenance/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
