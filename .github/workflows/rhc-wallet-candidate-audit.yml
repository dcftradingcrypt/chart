name: RHC focused wallet candidate audit
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-wallet-candidate-audit.yml'
      - 'wallet-probe/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python wallet-probe/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-focused-wallet-audit
          path: out-wallet-probe/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
