name: RHC wallet-indexed Transfer log probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-wallet-log-probe.yml'
      - 'wallet-verification/wallet_log_probe.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python wallet-verification/wallet_log_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-wallet-log-probe
          path: out-wallet-log-probe/
          retention-days: 2
          if-no-files-found: error
