name: RHC provenance-first wallet history probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-wallet-provenance.yml'
      - 'wallet-probe/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: rhc-wallet-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete slow research runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          for run in \
            33009235517 33009235599 33017288945 33020452495 \
            33021553812 33021553873 33021625789 33021625803; do
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run/cancel" >/dev/null
          done
          exit 0

  probe:
    needs: cancel-obsolete
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch full public Robinscan histories for explicitly sourced candidates
        run: python wallet-probe/probe_wallets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-wallet-provenance
          path: out-wallet-probe/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
