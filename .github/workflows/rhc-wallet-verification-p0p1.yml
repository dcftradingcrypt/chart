name: RHC wallet verification P0-P1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-wallet-verification-p0p1.yml'
      - 'wallet-verification/**'

permissions:
  contents: read

concurrency:
  group: rhc-wallet-verification-p0p1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize audited collector and fixed P0-P1 input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          base64 -d wallet-verification/collector.py.gz.b64 | gzip -d > runtime/collector.py
          base64 -d wallet-verification/wallets.json.gz.b64 | gzip -d > runtime/wallets.json
          python -m py_compile runtime/collector.py
          python - <<'PY'
          import json
          rows=json.load(open('runtime/wallets.json'))
          assert len(rows)==20
          assert sum(x['priority']=='P0' for x in rows)==1
          assert sum(x['priority']=='P1' for x in rows)==19
          print({'wallets':len(rows),'p0':1,'p1':19})
          PY
      - name: Collect and verify P0-P1 canonical evidence
        shell: bash
        run: python runtime/collector.py --wallets runtime/wallets.json --out out-wallet-verification
      - name: Preserve collector and fixed inputs in artifact
        if: always()
        shell: bash
        run: |
          mkdir -p out-wallet-verification/runtime
          cp runtime/collector.py runtime/wallets.json out-wallet-verification/runtime/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-wallet-verification-p0p1
          path: out-wallet-verification/
          retention-days: 3
          if-no-files-found: error
          compression-level: 9
