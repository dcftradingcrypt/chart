name: RHC canonical zero-address NFT mint universe v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/rhc-zero-mint-universe-v3.yml'
      - 'canonical-completion/run_corrected_v2.py'
      - 'canonical-completion/zero_mint_collector.py'

permissions:
  contents: read

concurrency:
  group: rhc-zero-mint-universe-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [erc721, erc1155_single, erc1155_batch]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input pycryptodome==3.23.0
      - name: Collect corrected canonical zero-address mint universe
        run: python canonical-completion/run_corrected_v2.py --kind zero -- --target '${{ matrix.target }}' --out 'out-${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhc-zero-mints-v3-${{ matrix.target }}
          path: out-${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: error
          compression-level: 9
