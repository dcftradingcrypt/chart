name: pokemon-audit-sources
on:
  push:
    branches: [main]
    paths-ignore:
      - '.scratch/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out work
          git clone --depth 1 https://github.com/22mah22/damage-calc.git work/damage-calc
          git clone --depth 1 https://github.com/Gheist23/pokemonbattledata.git work/pokemonbattledata
          git clone --depth 1 https://github.com/EricTron-FR/PokeCounter.app.git work/PokeCounter.app
          for d in damage-calc pokemonbattledata PokeCounter.app; do
            git -C "work/$d" rev-parse HEAD > "out/${d}.commit.txt"
            rm -rf "work/$d/.git"
            tar -C work -czf "out/${d}.tar.gz" "$d"
          done
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lh out
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-audit-sources
          path: out
          if-no-files-found: error
          retention-days: 7
      - name: Publish run locator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch
          cat > .scratch/pokemon_audit_run.json <<JSON
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "job_status": "${{ job.status }}",
            "artifact_name": "pokemon-audit-sources"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .scratch/pokemon_audit_run.json
          git commit -m 'Record Pokémon source artifact run [skip ci]' || exit 0
          git push
